[project]
name = "workmemory"
version = "0.1.0"
description = "Local-first work memory assistant with PostgreSQL and pluggable memory"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.135.1,<1",
  "uvicorn>=0.41,<1",
  "sqlalchemy[asyncio]>=2.0.43,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.16,<2",
  "pydantic>=2.12.5,<3",
  "pyyaml>=6.0.3,<7",
  "httpx>=0.28.1,<1",
  "python-dotenv>=1.1,<2",
  "reme-ai[as]==0.4.1.13",
  "graphiti-core==0.30.2",
  "jieba>=0.42.1",
  "mcp==1.30.0",
  "rapidfuzz>=3.14,<4",
  "pillow>=12,<13",
  "python-multipart>=0.0.20,<1",
]
[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=1.0", "ruff>=0.12"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["backend/workmemory"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires a real isolated PostgreSQL database", "live: requires real model and memory services"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[project.entry-points."reme.plugins"]
workmemory_ollama = "workmemory.memory"
