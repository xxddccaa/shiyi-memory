name: workmemory
services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17}
    restart: unless-stopped
    mem_limit: 1g
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workmemory}
      POSTGRES_USER: ${POSTGRES_USER:-workmemory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run bootstrap first}
    volumes:
      - type: bind
        source: ${PROJECT_ROOT:?required}/data/postgres
        target: /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 30
  neo4j:
    profiles: [graphiti]
    image: ${NEO4J_IMAGE:-neo4j:5.26-community}
    restart: unless-stopped
    mem_limit: 2g
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Run bootstrap first}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
      NEO4J_dbms_usage__report_enabled: "false"
    volumes:
      - type: bind
        source: ${PROJECT_ROOT:?required}/data/neo4j/data
        target: /data
      - type: bind
        source: ${PROJECT_ROOT:?required}/data/neo4j/logs
        target: /logs
      - type: bind
        source: ${PROJECT_ROOT:?required}/data/neo4j/import
        target: /var/lib/neo4j/import
      - type: bind
        source: ${PROJECT_ROOT:?required}/data/neo4j/plugins
        target: /plugins
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://localhost:7474 || exit 1']
      interval: 5s
      timeout: 5s
      retries: 40
