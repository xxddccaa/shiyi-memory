[project]
name = "workmemory-ocr"
version = "0.1.0"
description = "Project-local PaddleOCR service; screenshots remain in memory"
requires-python = ">=3.12,<3.13"
dependencies = [
  "paddleocr==3.7.0",
  "paddlepaddle==3.3.1",
  "paddlex==3.7.2",
  "fastapi>=0.135.1,<1",
  "uvicorn>=0.41,<1",
  "httpx>=0.28.1,<1",
  "pillow>=11,<13",
]
[dependency-groups]
dev = ["pytest>=8.3"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["workmemory_ocr"]
[tool.pytest.ini_options]
testpaths = ["tests"]
